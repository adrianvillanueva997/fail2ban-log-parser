name: Python Binding CI

on:
    push:
        branches: [main]
        paths:
            - "crates/fail2ban-log-parser-core/**"
            - "bindings/py-fail2ban-log-parser/**"

    pull_request:
        branches: [main]
        paths:
            - "crates/fail2ban-log-parser-core/**"
            - "bindings/py-fail2ban-log-parser/**"

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
              with:
                  python-version: ${{ matrix.python-version }}
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
              with:
                  toolchain: stable
                  cache: true
            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
            - name: Install make
              uses: ./.github/actions/install-make
              with:
                  os: ${{ matrix.os }}
            - name: Build and install binding
              run: make build-python
            - name: Run tests
              run: make test-python

    benchmark:
        name: Benchmark Python bindings
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Setup Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 #v7.1.0
              with:
                  python-version: "3.12"
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
              with:
                  toolchain: stable
                  cache: true
            - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
            - name: Install make
              uses: ./.github/actions/install-make
              with:
                  os: ubuntu
            - name: Build binding
              run: make build-python
            - name: Run benchmarks
              run: make bench-python
            - name: Store benchmark results
              uses: benchmark-action/github-action-benchmark@v1
              with:
                  name: Python Bindings Benchmarks
                  tool: customBiggerIsBetter
                  output-file-path: bindings/py-fail2ban-log-parser/benchmark/benchmark-results.json
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  auto-push: ${{ github.ref == 'refs/heads/main' }}
                  alert-threshold: "110%"
                  comment-on-alert: true
                  fail-on-alert: false
