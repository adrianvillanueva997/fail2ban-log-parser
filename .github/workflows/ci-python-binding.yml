name: Python Binding CI

on:
    push:
        branches: [main]
        paths:
            - "crates/fail2ban-log-parser-core/**"
            - "bindings/py-fail2ban-log-parser/**"

    pull_request:
        branches: [main]
        paths:
            - "crates/fail2ban-log-parser-core/**"
            - "bindings/py-fail2ban-log-parser/**"

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Setup Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 #v6.3.0
              with:
                  python-version: ${{ matrix.python-version }}
            - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  toolchain: stable
                  cache: true
            - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
            - name: Install make
              uses: ./.github/actions/install-make
              with:
                  os: ${{ matrix.os }}
            - name: Build and install binding
              run: make build-python
            - name: Run tests
              run: make test-python

    benchmark:
        name: Benchmark Python bindings
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Setup Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 #v6.3.0
              with:
                  python-version: "3.12"
            - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  toolchain: stable
                  cache: true
            - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
            - name: Install make
              uses: ./.github/actions/install-make
              with:
                  os: ubuntu
            - name: Build binding
              run: make build-python
            - name: Run benchmarks
              run: make bench-python
            - name: Store benchmark results
              uses: benchmark-action/github-action-benchmark@v1
              with:
                  name: Python Bindings Benchmarks
                  tool: customBiggerIsBetter
                  output-file-path: bindings/py-fail2ban-log-parser/benchmark/benchmark-results.json
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  auto-push: ${{ github.ref == 'refs/heads/main' }}
                  alert-threshold: "110%"
                  comment-on-alert: true
                  fail-on-alert: false
