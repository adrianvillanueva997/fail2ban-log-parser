name: CI - JS Bindings

on:
    push:
        branches: [main]
        paths:
            - "crates/fail2ban-log-parser-core/**"
            - "bindings/js-fail2ban-log-parser/**"
    pull_request:
        branches: [main]
        paths:
            - "crates/fail2ban-log-parser-core/**"
            - "bindings/js-fail2ban-log-parser/**"

permissions:
    contents: write
    pull-requests: write

jobs:
    js-bindings:
        name: JS bindings build+test
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node-version: [22, 24]

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 #v6.0.9
              name: Install pnpm
              with:
                  version: latest
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install make
              uses: ./.github/actions/install-make
              with:
                  os: ${{ matrix.os }}

            - name: Install dependencies
              run: cd bindings/js-fail2ban-log-parser && pnpm install

            - name: Build bindings
              run: make build-js

            - name: Run tests
              run: make test-js

    benchmark:
        name: Benchmark JS bindings
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 #v6.0.9
              name: Install pnpm
              with:
                  version: latest
            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 22 

            - name: Install make
              uses: ./.github/actions/install-make
              with:
                  os: ubuntu

            - name: Install dependencies
              run: cd bindings/js-fail2ban-log-parser && pnpm install

            - name: Build bindings
              run: make build-js

            - name: Run benchmarks
              run: make bench-js

            - name: Store benchmark results
              uses: benchmark-action/github-action-benchmark@v1
              with:
                  name: JS Bindings Benchmarks
                  tool: customBiggerIsBetter
                  output-file-path: bindings/js-fail2ban-log-parser/benchmark/benchmark-results.json
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  auto-push: ${{ github.ref == 'refs/heads/main' }}
                  alert-threshold: 110%
                  comment-on-alert: true
                  fail-on-alert: false
